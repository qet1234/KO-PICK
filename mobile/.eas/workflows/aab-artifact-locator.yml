name: Locate existing Play AAB

on:
  pull_request:
    branches:
      - main
    paths:
      - "mobile/.eas/workflows/aab-artifact-locator.yml"

jobs:
  locate_aab:
    name: Locate successful production Android build
    type: get-build
    params:
      platform: android
      profile: production
      distribution: store
      app_identifier: com.koreapick.app
      git_commit_hash: bf991d225de88420c36e17756e5cec1943a71eee
      wait_for_in_progress: false

  comment_aab:
    name: Publish downloadable existing AAB
    needs: [locate_aab]
    type: github-comment
    params:
      message: "Google Play 수동 업로드용 기존 production AAB입니다."
      build_ids:
        - ${{ needs.locate_aab.outputs.build_id }}

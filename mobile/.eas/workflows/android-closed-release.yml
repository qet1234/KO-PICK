name: Android Play AAB build

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "!mobile/.eas/**"
      - "!mobile/.aab-build-trigger"
      - "!mobile/**/*.md"
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android AAB for manual Play upload
    type: build
    params:
      platform: android
      profile: production

name: Mobile Preview APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-preview-apk.yml"
  workflow_dispatch:

concurrency:
  group: mobile-preview-apk
  cancel-in-progress: true

jobs:
  build-and-refresh-link:
    name: Build latest Android preview APK and refresh download URL
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Expo token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "Add EXPO_TOKEN to repository Actions secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build latest preview APK on EAS
        shell: bash
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

      - name: Resolve latest APK artifact URL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          build_json="$(eas build:list --platform android --status finished --limit 1 --json --non-interactive)"
          download_url="$(printf '%s' "$build_json" | jq -r '.[0].artifacts.buildUrl // empty')"
          if [ -z "$download_url" ]; then
            echo "Latest Android build artifact URL was not found."
            printf '%s\n' "$build_json"
            exit 1
          fi
          case "$download_url" in
            https://expo.dev/artifacts/eas/*.apk) ;;
            https://expo.dev/artifacts/eas/*) ;;
            *)
              echo "Unexpected EAS artifact URL: $download_url"
              exit 1
              ;;
          esac
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"
          echo "Latest APK artifact resolved."

      - name: Update public APK download target
        env:
          DOWNLOAD_URL: ${{ steps.artifact.outputs.download_url }}
        shell: bash
        run: |
          set -euo pipefail
          target="../app/api/app-download/latest-apk.ts"
          cat > "$target" <<EOF
          // This file is updated automatically after a successful EAS Android preview build.
          export const latestAndroidApkUrl =
            "$DOWNLOAD_URL";
          EOF

          if git diff --quiet -- "$target"; then
            echo "Public APK URL is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Refresh latest Android APK download URL"
          git push origin HEAD:main

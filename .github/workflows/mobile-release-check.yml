name: Mobile release check

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-release-check.yml"
  workflow_dispatch:

concurrency:
  group: mobile-release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Android image assets
        run: npm run verify:assets

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Expo Doctor
        run: npm run doctor

      - name: Verify release Expo config
        env:
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_SUPABASE_URL: https://release-check.invalid
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: release-check
          EXPO_PUBLIC_NAVER_MAP_CLIENT_ID: release-check
          EXPO_PUBLIC_WEB_URL: https://release-check.invalid
        run: npx expo config --type public > /tmp/expo-public-config.txt

name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vbwaruzncfaxnjyybudm
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect changed Supabase resources
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "functions=*" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi
          changed_files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if grep -q '^supabase/migrations/' <<<"$changed_files"; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi
          functions="$(sed -n 's|^supabase/functions/\([^/]*\)/.*|\1|p' <<<"$changed_files" | sort -u | paste -sd, -)"
          echo "functions=$functions" >> "$GITHUB_OUTPUT"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Apply database migration
        if: steps.changes.outputs.migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail
          migration_applied=false
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            if supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" \
              && supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" \
              && supabase db push --linked --password "$SUPABASE_DB_PASSWORD"; then
              migration_applied=true
            else
              echo "The configured database password could not apply migrations; using the Supabase Management API fallback."
            fi
          fi

          if [ "$migration_applied" != true ]; then
            # The reviewed migration may already have been applied through the management API.
            # Only verify its recorded version; never replay historical CREATE OR REPLACE statements.
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "Repair the database connection before manually applying migrations."
              exit 1
            fi
            mapfile -t changed_migrations < <(git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA" -- 'supabase/migrations/*.sql')
            test "${#changed_migrations[@]}" -gt 0
            for migration in "${changed_migrations[@]}"; do
              version="$(basename "$migration" | cut -d_ -f1)"
              [[ "$version" =~ ^[0-9]{14}$ ]] || exit 1
              jq -n --arg version "$version" '{query: ("select exists(select 1 from supabase_migrations.schema_migrations where version = '\''" + $version + "'\'') as applied"), read_only: true}' > verify-applied.json
              curl --fail-with-body --silent --show-error --max-time 30 \
                --request POST \
                --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                --header "Content-Type: application/json" \
                --data-binary @verify-applied.json \
                "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" > verify-applied-response.json
              jq -e '.[0].applied == true' verify-applied-response.json >/dev/null || {
                echo "Migration $version is not recorded. Apply it through a reviewed migration workflow."
                exit 1
              }
            done
          fi

      - name: Verify privacy, sharing, and admin migrations
        if: steps.changes.outputs.migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{
            query: "select to_regclass('\''public.support_requests'\'') is not null and to_regprocedure('\''public.prepare_account_deletion(uuid,text)'\'') is not null and to_regclass('\''public.user_legal_consents'\'') is not null and to_regclass('\''public.shared_courses'\'') is not null and to_regprocedure('\''public.get_shared_course(text)'\'') is not null and to_regprocedure('\''public.revoke_course_share(uuid)'\'') is not null and to_regclass('\''public.admin_users'\'') is not null and to_regclass('\''public.admin_traffic_events'\'') is not null and to_regclass('\''public.app_service_status'\'') is not null and exists (select 1 from public.app_service_status where id = 1 and jsonb_typeof(feature_flags) = '\''object'\'' and security_management_enabled is not null) and to_regprocedure('\''public.get_admin_traffic_dashboard(integer)'\'') is not null and to_regclass('\''public.user_saved_places'\'') is not null and to_regclass('\''public.user_recent_places'\'') is not null and to_regclass('\''public.place_polls'\'') is not null and to_regprocedure('\''public.create_place_poll(text,jsonb)'\'') is not null and to_regprocedure('\''public.get_shared_place_poll(text,text)'\'') is not null and to_regprocedure('\''public.vote_shared_place_poll(text,uuid,text,text)'\'') is not null and to_regclass('\''public.admin_operation_events'\'') is not null and to_regclass('\''public.place_information_reports'\'') is not null and to_regprocedure('\''public.get_admin_operations_dashboard(integer)'\'') is not null and to_regprocedure('\''public.get_place_engagement_scores(text[],integer)'\'') is not null and exists (select 1 from pg_constraint where conname = '\''admin_operation_events_event_type_check'\'' and pg_get_constraintdef(oid) like '\''%search_success%'\'') and exists (select 1 from public.admin_users au join auth.users u on u.id = au.user_id where encode(extensions.digest(convert_to(lower(coalesce(u.email, '\'''\'')), '\''UTF8'\''), '\''sha256'\''), '\''hex'\'') = '\''c6f4117eca2c8ebcfcfe58937453619a530ae85c818549e65ed13a718d7463b2'\'') as ready"
          }' > verify-migration.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @verify-migration.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            | tee verify-migration-response.json
          jq -e '.[0].ready == true' verify-migration-response.json >/dev/null

      - name: Verify iOS service status columns are removed
        if: steps.changes.outputs.migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{query: "select to_regclass('\''public.app_service_status'\'') is not null and not exists (select 1 from information_schema.columns where table_schema = '\''public'\'' and table_name = '\''app_service_status'\'' and column_name in ('\''ios_min_version'\'', '\''ios_force_update'\'', '\''ios_store_url'\'')) as ready", read_only: true}' > verify-ios-removed.json
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @verify-ios-removed.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            | tee verify-ios-removed-response.json
          jq -e '.[0].ready == true' verify-ios-removed-response.json >/dev/null

      - name: Verify Together Spaces data and APIs are removed
        if: steps.changes.outputs.migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{
            query: "select to_regclass('\''public.spaces'\'') is null and to_regclass('\''public.space_members'\'') is null and to_regclass('\''public.space_reservation_plans'\'') is null and to_regclass('\''public.couples'\'') is null and to_regclass('\''public.couple_members'\'') is null and to_regprocedure('\''public.list_my_spaces(text)'\'') is null and to_regprocedure('\''public.create_shared_space(text,text,text)'\'') is null and to_regprocedure('\''public.list_my_reservations(uuid)'\'') is null and to_regprocedure('\''public.prepare_account_deletion(uuid,text)'\'') is not null as ready"
          }' > verify-together-removed.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @verify-together-removed.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            | tee verify-together-removed-response.json
          jq -e '.[0].ready == true' verify-together-removed-response.json >/dev/null

      - name: Deploy changed regular Edge Functions
        env:
          CHANGED_FUNCTIONS: ${{ steps.changes.outputs.functions }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CHANGED_FUNCTIONS" ]; then
            echo "No Edge Function changes detected."
            exit 0
          fi

          if [ "$CHANGED_FUNCTIONS" = "*" ]; then
            mapfile -t functions < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          else
            IFS=',' read -r -a functions <<<"$CHANGED_FUNCTIONS"
          fi

          for function_name in "${functions[@]}"; do
            case "$function_name" in
              kopick-api|kopick-gateway|kopick-place-gateway|kopick-core|naver-userinfo|sync-tour-places)
                echo "Skipping $function_name; its dedicated workflow owns deployment."
                continue
                ;;
            esac
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          done

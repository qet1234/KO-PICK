name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vbwaruzncfaxnjyybudm
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Apply database migration
        env:
          LEGAL_SHARE_MIGRATION: supabase/migrations/20260731223000_legal_course_sharing.sql
        shell: bash
        run: |
          set -euo pipefail
          migration_applied=false
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            if supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" \
              && supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" \
              && supabase db push --linked --password "$SUPABASE_DB_PASSWORD"; then
              migration_applied=true
            else
              echo "The configured database password could not apply migrations; using the Supabase Management API fallback."
            fi
          fi

          if [ "$migration_applied" != true ]; then
            echo "Applying the reviewed legal sharing migration through the Supabase Management API."
            jq -Rs '{query: .}' "$LEGAL_SHARE_MIGRATION" > legal-share-migration.json
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @legal-share-migration.json \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query"
          fi

      - name: Verify privacy and sharing migrations
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{
            query: "select to_regclass('\''public.support_requests'\'') is not null and to_regprocedure('\''public.prepare_account_deletion(uuid,text)'\'') is not null and to_regclass('\''public.user_legal_consents'\'') is not null and to_regclass('\''public.shared_courses'\'') is not null and to_regprocedure('\''public.get_shared_course(text)'\'') is not null and to_regprocedure('\''public.revoke_course_share(uuid)'\'') is not null as ready"
          }' > verify-migration.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @verify-migration.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            | tee verify-migration-response.json
          jq -e '.[0].ready == true' verify-migration-response.json >/dev/null

      - name: Deploy regular Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for directory in supabase/functions/*; do
            [ -d "$directory" ] || continue
            function_name="$(basename "$directory")"
            case "$function_name" in
              kopick-api|kopick-gateway|kopick-place-gateway|kopick-core) continue ;;
            esac
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          done

      - name: Deploy KO-PICK core and public gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -rf supabase/functions/kopick-core
          cp -R supabase/functions/kopick-api supabase/functions/kopick-core
          sed -i 's|const marker = "/kopick-api";|const marker = "/kopick-core";|' supabase/functions/kopick-core/index.ts
          supabase functions deploy kopick-core --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          cp supabase/functions/kopick-place-gateway/index.ts supabase/functions/kopick-api/index.ts
          supabase functions deploy kopick-api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

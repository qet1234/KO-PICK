name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vbwaruzncfaxnjyybudm
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Apply database migration
        env:
          ADMIN_MIGRATION: supabase/migrations/20260810130000_admin_dashboard.sql
          APP_STATUS_MIGRATION: supabase/migrations/20260810170000_app_service_status.sql
          SECURITY_MONITORING_MIGRATION: supabase/migrations/20260812111000_admin_security_monitoring.sql
          COUPLE_DISABLE_MIGRATION: supabase/migrations/20260810194000_disable_couple_space_feature.sql
          OPERATOR_MIGRATION: supabase/migrations/20260810150000_register_primary_operator.sql
          LEGAL_SHARE_MIGRATION: supabase/migrations/20260731223000_legal_course_sharing.sql
          PLACE_LIBRARY_MIGRATION: supabase/migrations/20260811113000_place_library_and_shared_polls.sql
          OPERATIONS_MIGRATION: supabase/migrations/20260811150000_operations_observability.sql
          TOGETHER_REMOVAL_MIGRATION: supabase/migrations/20260811180000_remove_together_spaces.sql
        shell: bash
        run: |
          set -euo pipefail
          migration_applied=false
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            if supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" \
              && supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" \
              && supabase db push --linked --password "$SUPABASE_DB_PASSWORD"; then
              migration_applied=true
            else
              echo "The configured database password could not apply migrations; using the Supabase Management API fallback."
            fi
          fi

          if [ "$migration_applied" != true ]; then
            for migration in "$LEGAL_SHARE_MIGRATION" "$ADMIN_MIGRATION" "$OPERATOR_MIGRATION" "$APP_STATUS_MIGRATION" "$SECURITY_MONITORING_MIGRATION" "$COUPLE_DISABLE_MIGRATION" "$PLACE_LIBRARY_MIGRATION" "$OPERATIONS_MIGRATION" "$TOGETHER_REMOVAL_MIGRATION"; do
              echo "Applying reviewed migration $(basename "$migration") through the Supabase Management API."
              jq -Rs '{query: .}' "$migration" > reviewed-migration.json
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                --header "Content-Type: application/json" \
                --data-binary @reviewed-migration.json \
                "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query"
            done
          fi

      - name: Verify privacy, sharing, and admin migrations
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{
            query: "select to_regclass('\''public.support_requests'\'') is not null and to_regprocedure('\''public.prepare_account_deletion(uuid,text)'\'') is not null and to_regclass('\''public.user_legal_consents'\'') is not null and to_regclass('\''public.shared_courses'\'') is not null and to_regprocedure('\''public.get_shared_course(text)'\'') is not null and to_regprocedure('\''public.revoke_course_share(uuid)'\'') is not null and to_regclass('\''public.admin_users'\'') is not null and to_regclass('\''public.admin_traffic_events'\'') is not null and to_regclass('\''public.app_service_status'\'') is not null and exists (select 1 from public.app_service_status where id = 1 and jsonb_typeof(feature_flags) = '\''object'\'' and security_management_enabled is not null) and to_regprocedure('\''public.get_admin_traffic_dashboard(integer)'\'') is not null and to_regclass('\''public.user_saved_places'\'') is not null and to_regclass('\''public.user_recent_places'\'') is not null and to_regclass('\''public.place_polls'\'') is not null and to_regprocedure('\''public.create_place_poll(text,jsonb)'\'') is not null and to_regprocedure('\''public.get_shared_place_poll(text,text)'\'') is not null and to_regprocedure('\''public.vote_shared_place_poll(text,uuid,text,text)'\'') is not null and to_regclass('\''public.admin_operation_events'\'') is not null and to_regclass('\''public.place_information_reports'\'') is not null and to_regprocedure('\''public.get_admin_operations_dashboard(integer)'\'') is not null and exists (select 1 from public.admin_users au join auth.users u on u.id = au.user_id where encode(extensions.digest(convert_to(lower(coalesce(u.email, '\'''\'')), '\''UTF8'\''), '\''sha256'\''), '\''hex'\'') = '\''c6f4117eca2c8ebcfcfe58937453619a530ae85c818549e65ed13a718d7463b2'\'') as ready"
          }' > verify-migration.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @verify-migration.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            | tee verify-migration-response.json
          jq -e '.[0].ready == true' verify-migration-response.json >/dev/null

      - name: Verify Together Spaces data and APIs are removed
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{
            query: "select to_regclass('\''public.spaces'\'') is null and to_regclass('\''public.space_members'\'') is null and to_regclass('\''public.space_reservation_plans'\'') is null and to_regclass('\''public.couples'\'') is null and to_regclass('\''public.couple_members'\'') is null and to_regprocedure('\''public.list_my_spaces(text)'\'') is null and to_regprocedure('\''public.create_shared_space(text,text,text)'\'') is null and to_regprocedure('\''public.list_my_reservations(uuid)'\'') is null and to_regprocedure('\''public.prepare_account_deletion(uuid,text)'\'') is not null as ready"
          }' > verify-together-removed.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @verify-together-removed.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            | tee verify-together-removed-response.json
          jq -e '.[0].ready == true' verify-together-removed-response.json >/dev/null

      - name: Deploy regular Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for directory in supabase/functions/*; do
            [ -d "$directory" ] || continue
            function_name="$(basename "$directory")"
            case "$function_name" in
              kopick-api|kopick-gateway|kopick-place-gateway|kopick-core) continue ;;
            esac
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          done

      - name: Deploy KO-PICK core and public gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -rf supabase/functions/kopick-core
          cp -R supabase/functions/kopick-api supabase/functions/kopick-core
          sed -i 's|const marker = "/kopick-api";|const marker = "/kopick-core";|' supabase/functions/kopick-core/index.ts
          supabase functions deploy kopick-core --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          cp supabase/functions/kopick-place-gateway/index.ts supabase/functions/kopick-api/index.ts
          supabase functions deploy kopick-api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
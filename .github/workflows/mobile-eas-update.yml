name: Mobile Android and iOS automatic update

on:
  push:
    branches:
      - main
    paths:
      - "mobile/src/**"
      - "mobile/assets/**"
      - "mobile/config/**"
      - ".github/workflows/mobile-eas-update.yml"
  workflow_dispatch:

concurrency:
  group: mobile-eas-update
  cancel-in-progress: true

jobs:
  publish-update:
    name: Publish runtime OTA updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Expo token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.EXPO_TOKEN }}" || {
            echo "Missing GitHub Actions secret: EXPO_TOKEN"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish Android production update
        run: eas update --channel production --platform android --message "${{ github.event.head_commit.message || 'Manual Android production update' }}" --environment production --non-interactive

      - name: Publish Android and iOS preview update
        run: eas update --channel preview --platform all --message "${{ github.event.head_commit.message || 'Manual preview update' }}" --environment preview --non-interactive

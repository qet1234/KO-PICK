name: Mobile Android release

on:
  push:
    branches:
      - main
    paths:
      - "mobile/app.config.ts"
      - "mobile/assets/**"
      - "mobile/eas.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/mobile-apk-release.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-production-aab
  cancel-in-progress: true

jobs:
  build:
    name: Build Google Play production AAB with EAS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Expo token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "Add EXPO_TOKEN to the repository Actions secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          png_signature() {
            xxd -p -l 8 "$1" | tr -d '\n'
          }
          is_png() {
            [ -f "$1" ] && [ "$(png_signature "$1")" = "89504e470d0a1a0a" ]
          }

          if ! is_png assets/icon.png || ! is_png assets/adaptive-icon.png; then
            echo "Current launcher icon assets are not valid PNG files. Restoring the last known-good Android release icons."
            git fetch --depth=1 origin ffdfa427deead735858d8d7a2b08c00a71b12cbf
            git show ffdfa427deead735858d8d7a2b08c00a71b12cbf:mobile/assets/icon.png > assets/icon.png
            git show ffdfa427deead735858d8d7a2b08c00a71b12cbf:mobile/assets/adaptive-icon.png > assets/adaptive-icon.png
          fi

          is_png assets/icon.png
          is_png assets/adaptive-icon.png
          echo "Android launcher icons are valid PNG files."

      - name: Validate mobile project
        run: |
          npm run typecheck
          npx expo-doctor
          npx expo config --type public >/tmp/expo-public-config.json

      - name: Verify Google Play target API configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'targetSdkVersion: 36' app.config.ts
          grep -q 'compileSdkVersion: 36' app.config.ts
          echo "Google Play target API configuration is set to API 36."

      - name: Build Google Play production AAB on EAS
        shell: bash
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --clear-cache \
            --wait

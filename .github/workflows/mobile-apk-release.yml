name: Mobile APK release

on:
  push:
    branches:
      - main
    paths:
      - "mobile/app.config.ts"
      - "mobile/assets/**"
      - "mobile/eas.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/mobile-apk-release.yml"
  workflow_dispatch:

concurrency:
  group: mobile-apk-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish Android APK locally
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/eas-local-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for EXPO_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "Add EXPO_TOKEN to the repository Actions secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Restore preview environment locally
        shell: bash
        run: |
          set -euo pipefail
          eas env:pull --environment preview --path .env.local --non-interactive
          test -s .env.local
          echo "Preview environment restored for local APK build."

      - name: Build standalone APK locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          rm -f "$RUNNER_TEMP/koreapick-latest.apk"
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output "$RUNNER_TEMP/koreapick-latest.apk"
          test -s "$RUNNER_TEMP/koreapick-latest.apk"

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner_path="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$RUNNER_TEMP/koreapick-latest.apk"

      - name: Publish stable download asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest "$RUNNER_TEMP/koreapick-latest.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-latest "$RUNNER_TEMP/koreapick-latest.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "오늘어디 Android 최신 버전" \
              --notes "오늘어디 Android 테스트용 최신 APK입니다."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: koreapick-latest-apk
          path: ${{ runner.temp }}/koreapick-latest.apk
          if-no-files-found: error
          retention-days: 7

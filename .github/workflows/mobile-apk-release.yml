name: Mobile Android release

on:
  push:
    branches:
      - main
    paths:
      - "mobile/app.config.ts"
      - "mobile/assets/**"
      - "mobile/eas.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/mobile-apk-release.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-production-aab
  cancel-in-progress: true

jobs:
  build:
    name: Build Android production AAB with EAS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Expo token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "Add EXPO_TOKEN to the repository Actions secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate mobile project
        run: |
          npm run typecheck
          npx expo-doctor

      - name: Build Google Play production AAB on EAS
        shell: bash
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait

name: Mobile APK release

on:
  push:
    branches:
      - main
    paths:
      - "mobile/app.config.ts"
      - "mobile/assets/**"
      - "mobile/eas.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/mobile-apk-release.yml"
  workflow_dispatch:

concurrency:
  group: mobile-apk-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for EXPO_TOKEN
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add EXPO_TOKEN to the repository Actions secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build standalone APK
        id: eas-build
        shell: bash
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-build.json', 'utf8'));
          const build = Array.isArray(result) ? result[0] : result;
          const artifactUrl = build?.artifacts?.applicationArchiveUrl;

          if (!artifactUrl) {
            throw new Error('EAS build result did not include an APK artifact URL.');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_url=${artifactUrl}\n`);
          NODE

      - name: Download APK artifact
        env:
          ARTIFACT_URL: ${{ steps.eas-build.outputs.artifact_url }}
        shell: bash
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output "$RUNNER_TEMP/koreapick-latest.apk"
          test -s "$RUNNER_TEMP/koreapick-latest.apk"

      - name: Publish stable download asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest "$RUNNER_TEMP/koreapick-latest.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-latest "$RUNNER_TEMP/koreapick-latest.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "오늘어디 Android 최신 버전" \
              --notes "오늘어디 Android 테스트용 최신 APK입니다."
          fi

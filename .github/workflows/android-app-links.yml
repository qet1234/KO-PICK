name: Configure verified Android App Links

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-app-links.yml'
  workflow_dispatch:

concurrency:
  group: android-app-links
  cancel-in-progress: true

jobs:
  publish-assetlinks:
    name: Publish Android Digital Asset Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download latest signed Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download android-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'koreapick-latest.apk' \
            --output "$RUNNER_TEMP/koreapick-latest.apk" \
            --clobber
          test -s "$RUNNER_TEMP/koreapick-latest.apk"

      - name: Extract signing certificate fingerprint
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner_path="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo 'Android apksigner was not found on the runner.'
            exit 1
          fi

          cert_output="$($apksigner_path verify --print-certs "$RUNNER_TEMP/koreapick-latest.apk")"
          digest="$(printf '%s\n' "$cert_output" \
            | grep -i -m1 'certificate SHA-256 digest' \
            | sed -E 's/.*digest:[[:space:]]*//I' \
            | tr -d '[:space:]:' \
            | tr '[:lower:]' '[:upper:]')"

          if ! printf '%s' "$digest" | grep -Eq '^[0-9A-F]{64}$'; then
            echo 'Could not read a valid SHA-256 signing certificate digest.'
            printf '%s\n' "$cert_output" | grep -i 'certificate.*digest' || true
            exit 1
          fi

          fingerprint="$(printf '%s' "$digest" | sed 's/../&:/g;s/:$//')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Android signing certificate fingerprint extracted successfully."

      - name: Write assetlinks.json
        env:
          FINGERPRINT: ${{ steps.certificate.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/.well-known
          cat > public/.well-known/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.koreapick.app",
                "sha256_cert_fingerprints": [
                  "$FINGERPRINT"
                ]
              }
            }
          ]
          EOF
          python -m json.tool public/.well-known/assetlinks.json >/dev/null

      - name: Commit verification file
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/.well-known/assetlinks.json && git ls-files --error-unmatch public/.well-known/assetlinks.json >/dev/null 2>&1; then
            echo 'assetlinks.json is already current.'
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          git commit -m "Publish Android App Links verification"
          git pull --rebase origin main
          git push origin HEAD:main

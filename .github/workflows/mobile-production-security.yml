name: Android production security build

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-production-security.yml"
  workflow_dispatch:

concurrency:
  group: android-production-security
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-aab:
    name: Build production AAB locally
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for EXPO_TOKEN
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is required in repository Actions secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate mobile project
        run: |
          npm run typecheck
          npm run lint
          npm run doctor

      - name: Build Google Play production AAB locally
        env:
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/eas-local-artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/oneul-eodi-production.aab"
          test -s "$RUNNER_TEMP/oneul-eodi-production.aab"
          file "$RUNNER_TEMP/oneul-eodi-production.aab"

      - name: Upload production AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-production-aab
          path: ${{ runner.temp }}/oneul-eodi-production.aab
          if-no-files-found: error
          retention-days: 7

  mobsf:
    name: MobSF static analysis
    needs: build-aab
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download production AAB
        uses: actions/download-artifact@v5
        with:
          name: android-production-aab
          path: artifacts

      - name: Start MobSF
        shell: bash
        run: |
          docker pull opensecurity/mobile-security-framework-mobsf:v4.5.2
          docker run -d --name mobsf -p 8000:8000 opensecurity/mobile-security-framework-mobsf:v4.5.2

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          echo "MobSF did not become ready."
          docker logs mobsf || true
          exit 1

      - name: Run MobSF AAB scan
        shell: bash
        run: |
          set -euo pipefail

          MOBSF_API_KEY=""
          for attempt in $(seq 1 30); do
            MOBSF_API_KEY=$(docker logs mobsf 2>&1 | sed -n 's/.*REST API Key:[[:space:]]*//p' | tail -n 1 | tr -d '\r' || true)
            if [ -n "$MOBSF_API_KEY" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$MOBSF_API_KEY" ]; then
            echo "Could not obtain the MobSF REST API key."
            docker logs mobsf || true
            exit 1
          fi

          echo "::add-mask::$MOBSF_API_KEY"
          MOBSF_URL="http://127.0.0.1:8000/api/v1"
          AAB="artifacts/oneul-eodi-production.aab"
          test -s "$AAB"

          UPLOAD_BODY="$RUNNER_TEMP/mobsf-upload.json"
          UPLOAD_CODE=$(curl --silent --show-error \
            --output "$UPLOAD_BODY" \
            --write-out "%{http_code}" \
            -H "Authorization: $MOBSF_API_KEY" \
            -F "file=@$AAB;type=application/octet-stream" \
            "$MOBSF_URL/upload")

          if [[ "$UPLOAD_CODE" != 2* ]]; then
            echo "MobSF upload failed with HTTP $UPLOAD_CODE"
            cat "$UPLOAD_BODY"
            docker logs --tail 200 mobsf || true
            exit 1
          fi

          HASH=$(jq -r '.hash // empty' "$UPLOAD_BODY")
          SCAN_TYPE=$(jq -r '.scan_type // empty' "$UPLOAD_BODY")
          FILE_NAME=$(jq -r '.file_name // empty' "$UPLOAD_BODY")
          if [ -z "$HASH" ]; then
            echo "MobSF upload did not return a scan hash."
            cat "$UPLOAD_BODY"
            exit 1
          fi

          SCAN_BODY="$GITHUB_WORKSPACE/mobsf-scan-result.json"
          SCAN_ARGS=(--data-urlencode "hash=$HASH" --data-urlencode "re_scan=0")
          if [ -n "$SCAN_TYPE" ]; then
            SCAN_ARGS+=(--data-urlencode "scan_type=$SCAN_TYPE")
          fi
          if [ -n "$FILE_NAME" ]; then
            SCAN_ARGS+=(--data-urlencode "file_name=$FILE_NAME")
          fi

          SCAN_CODE=$(curl --silent --show-error \
            --output "$SCAN_BODY" \
            --write-out "%{http_code}" \
            -H "Authorization: $MOBSF_API_KEY" \
            "${SCAN_ARGS[@]}" \
            "$MOBSF_URL/scan")

          if [[ "$SCAN_CODE" != 2* ]]; then
            echo "MobSF scan failed with HTTP $SCAN_CODE"
            cat "$SCAN_BODY"
            docker logs --tail 200 mobsf || true
            exit 1
          fi

          for attempt in $(seq 1 30); do
            PDF_CODE=$(curl --silent --show-error \
              --output "$GITHUB_WORKSPACE/mobsf-report.pdf" \
              --write-out "%{http_code}" \
              -H "Authorization: $MOBSF_API_KEY" \
              --data-urlencode "hash=$HASH" \
              "$MOBSF_URL/download_pdf" || true)

            if [[ "$PDF_CODE" == 2* ]] && [ -s "$GITHUB_WORKSPACE/mobsf-report.pdf" ]; then
              exit 0
            fi
            sleep 10
          done

          echo "MobSF PDF report was not generated successfully."
          docker logs --tail 200 mobsf || true
          exit 1

      - name: Upload MobSF report
        uses: actions/upload-artifact@v4
        with:
          name: mobsf-production-report
          path: |
            mobsf-report.pdf
            mobsf-scan-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop MobSF
        if: always()
        run: docker rm -f mobsf || true

name: Sync Full TourAPI Snapshot

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*tour_places_snapshot*.sql"
      - "supabase/functions/sync-tour-places/**"
      - "supabase/functions/kopick-place-gateway/**"
      - ".github/workflows/sync-tour-places.yml"
  workflow_dispatch:
    inputs:
      reset:
        description: Start a new full synchronization
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read
  statuses: write

concurrency:
  group: tourapi-full-snapshot-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vbwaruzncfaxnjyybudm
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark snapshot synchronization pending
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='TourAPI Full Snapshot' \
            -f description='Preparing the full Korea Tourism dataset' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing GitHub Secret: SUPABASE_ACCESS_TOKEN"; exit 1; }

      - name: Check whether synchronization is needed
        id: sync-state
        shell: bash
        env:
          FORCE_SYNC: ${{ github.event_name != 'schedule' || inputs.reset == true }}
        run: |
          set -euo pipefail
          if [ "$FORCE_SYNC" = "true" ]; then
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -n '{query: "select coalesce((select status <> '\''complete'\'' from public.tour_place_sync_state where singleton = true), true) as needs_sync", read_only: true}' > /tmp/sync-state-query.json
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'content-type: application/json' \
            --data-binary @/tmp/sync-state-query.json \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query")"

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            needs_sync="$(jq -r '.[0].needs_sync // true' "$response_file")"
          else
            echo "Snapshot state preflight failed with HTTP $status; continuing safely."
            needs_sync=true
          fi
          echo "needs_sync=$needs_sync" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        if: steps.sync-state.outputs.needs_sync == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply TourAPI snapshot schema
        if: steps.sync-state.outputs.needs_sync == 'true'
        id: schema
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260724134500_create_tour_places_snapshot.sql"
          test -f "$migration"
          jq -Rs '{query: ., read_only: false}' "$migration" > /tmp/database-query.json

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 120 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'content-type: application/json' \
            --data-binary @/tmp/database-query.json \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query")"

          echo "Database schema HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat "$response_file"
            summary="$(jq -r '.message // .error // .code // "database schema request failed"' "$response_file" 2>/dev/null | tr '\n' ' ' | cut -c1-110)"
            echo "DB_ERROR_SUMMARY=schema: ${summary}" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "TourAPI snapshot schema is ready."

      - name: Deploy snapshot synchronization function
        if: steps.sync-state.outputs.needs_sync == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          sync_token="$(openssl rand -hex 32)"
          echo "sync_token=$sync_token" >> "$GITHUB_OUTPUT"
          supabase secrets set TOUR_SYNC_TOKEN="$sync_token" --project-ref "$PROJECT_REF"
          supabase functions deploy sync-tour-places --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy snapshot-aware place gateway
        if: steps.sync-state.outputs.needs_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf supabase/functions/kopick-core
          cp -R supabase/functions/kopick-api supabase/functions/kopick-core
          supabase functions deploy kopick-core --project-ref "$PROJECT_REF" --no-verify-jwt
          cp supabase/functions/kopick-place-gateway/index.ts supabase/functions/kopick-api/index.ts
          supabase functions deploy kopick-api --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Continue full TourAPI synchronization
        if: steps.sync-state.outputs.needs_sync == 'true'
        id: synchronize
        shell: bash
        env:
          SYNC_TOKEN: ${{ steps.deploy.outputs.sync_token }}
          RESET_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.reset || false }}
        run: |
          set -euo pipefail
          endpoint="https://${PROJECT_REF}.supabase.co/functions/v1/sync-tour-places"
          current="$(curl --fail --silent --show-error --max-time 30 \
            --header "x-sync-token: $SYNC_TOKEN" "$endpoint")"
          echo "$current" | jq '{state: .state | {status, next_page, total_pages, total_count, imported_count, last_error}}'

          if [ "$(echo "$current" | jq -r '.state.status // "idle"')" = "complete" ] && [ "$RESET_REQUESTED" != "true" ]; then
            echo "$current" > /tmp/final-sync-state.json
            echo "Full snapshot is already complete."
            exit 0
          fi

          reset_body=false
          if [ "$RESET_REQUESTED" = "true" ]; then reset_body=true; fi

          for attempt in 1 2 3 4; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --max-time 150 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header 'content-type: application/json' \
              --header "x-sync-token: $SYNC_TOKEN" \
              --data "{\"maxPages\":5,\"reset\":${reset_body}}" \
              "$endpoint")"
            reset_body=false
            echo "Synchronization request $attempt HTTP status: $status"
            jq '{success, complete, paused, pagesProcessed, nextPage, totalPages, totalCount, importedCount, error}' "$response_file"

            if [ "$status" -ge 500 ]; then
              cat "$response_file"
              exit 1
            fi
            if [ "$(jq -r '.complete // false' "$response_file")" = "true" ]; then break; fi
            if [ "$(jq -r '.paused // false' "$response_file")" = "true" ]; then break; fi
          done

          curl --fail --silent --show-error --max-time 30 \
            --header "x-sync-token: $SYNC_TOKEN" "$endpoint" \
            | tee /tmp/final-sync-state.json \
            | jq '{state: .state | {status, next_page, total_pages, total_count, imported_count, last_error}}'

      - name: Report snapshot synchronization result
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          NEEDS_SYNC: ${{ steps.sync-state.outputs.needs_sync }}
        run: |
          if [ "$RESULT" = "success" ]; then
            state=success
            if [ "$NEEDS_SYNC" = "false" ]; then
              description='TourAPI snapshot is complete; deployment skipped'
            elif [ -f /tmp/final-sync-state.json ]; then
              status="$(jq -r '.state.status // "running"' /tmp/final-sync-state.json)"
              imported="$(jq -r '.state.imported_count // 0' /tmp/final-sync-state.json)"
              total="$(jq -r '.state.total_count // 0' /tmp/final-sync-state.json)"
              description="TourAPI snapshot ${status}: ${imported}/${total} rows"
            else
              description='TourAPI snapshot synchronization prepared'
            fi
          else
            state=failure
            description="${DB_ERROR_SUMMARY:-TourAPI snapshot setup failed; open workflow logs}"
          fi
          description="${description:0:140}"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='TourAPI Full Snapshot' \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

name: Frontend Build

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "frontend/**"
      - "public/**"
      - "scripts/**"
      - "utils/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "eslint.config.mjs"
      - "postcss.config.mjs"
      - "proxy.ts"
      - "tsconfig.json"
      - "vercel.json"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify legal course sharing safeguards
        run: npm run verify:legal-share

      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

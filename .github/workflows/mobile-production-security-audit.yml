name: Android production dependency security audit

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/mobile-production-security-audit.yml"

jobs:
  audit:
    name: Audit production npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Production dependency vulnerability summary:', counts);
          const critical = Number(counts.critical || 0);
          if (critical > 0) {
            console.error(`Blocking release: ${critical} critical production dependency vulnerabilities found.`);
            process.exit(1);
          }
          NODE

name: Google Play internal submit

on:
  workflow_dispatch:

concurrency:
  group: mobile-google-play-internal-submit
  cancel-in-progress: false

jobs:
  submit:
    name: Submit latest Android AAB to Google Play internal track
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is required."
            exit 1
          fi
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required for Play Console submission."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare temporary Play service account key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/google-play-service-account.json"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$key_path"
          chmod 600 "$key_path"
          node - "$key_path" <<'NODE'
          const fs = require('fs');
          const keyPath = process.argv[2];
          const easPath = 'eas.json';
          const eas = JSON.parse(fs.readFileSync(easPath, 'utf8'));
          eas.submit = eas.submit || {};
          eas.submit.internal = {
            android: {
              track: 'internal',
              releaseStatus: 'draft',
              serviceAccountKeyPath: keyPath,
            },
          };
          fs.writeFileSync(easPath, `${JSON.stringify(eas, null, 2)}\n`);
          NODE

      - name: Submit latest successful AAB to internal track
        run: eas submit --platform android --latest --profile internal --non-interactive

      - name: Remove temporary service account key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/google-play-service-account.json"
